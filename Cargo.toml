[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.10"
memchr = "2.7"
rustc-hash = "2.0"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arrow = { version = "53", default-features = false, features = ["prettyprint"] }
parquet = { version = "53", default-features = false, features = ["arrow", "snap"] }
mimalloc = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"