[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
memchr = "2.7"
rustc-hash = "2.0"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mimalloc = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"